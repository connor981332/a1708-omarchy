# CS8409 (MacBookPro14,x): capture started shortly after playback ends gets
# delayed several seconds while PipeWire suspends the shared PCM. Never suspend.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.pci-0000_00_1f.3.*" }
      { node.name = "~alsa_input.pci-0000_00_1f.3.*" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
